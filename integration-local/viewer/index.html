<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panoramiche 360°</title>
<link rel="stylesheet" href="vendor/psv/index.css">
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<style>
  :root {
    --bg: #080b0c;            /* mismos colores / tipografías que interiors3d.com */
    --accent: #00adb4;
    --text: #f7f8f8;
    --muted: rgba(247, 248, 248, .72);
    --line: rgba(255, 255, 255, .1);
    --display: Raleway, "Helvetica Neue", Arial, sans-serif;
    --body: Manrope, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--body); overflow: hidden; }
  body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

  /* Encabezado: título + descripción */
  #intro { flex: none; padding: 18px 28px 16px; background: rgba(8, 11, 12, .94); border-bottom: 1px solid var(--line); }
  #intro .rule { display: block; width: 36px; height: 2px; background: var(--accent); margin-bottom: 10px; }
  #intro h1 {
    margin: 0 0 6px; font: 800 clamp(17px, 1.2vw + 12px, 30px)/1.12 var(--display);
    letter-spacing: -.015em; text-transform: uppercase;
  }
  #intro p { margin: 0; max-width: 78ch; font: 500 clamp(12.5px, .25vw + 11.5px, 15px)/1.55 var(--body); color: var(--muted); letter-spacing: -.005em; }
  #intro:empty { display: none; }

  /* Escenario del visor */
  #stage { position: relative; flex: 1 1 auto; min-height: 0; }
  #main { position: absolute; inset: 0; touch-action: none; transition: opacity .25s ease; }
  #main.fading { opacity: 0; }
  .psv-navbar { display: none !important; } /* PSV deja una barra vacía aunque navbar:false */
  .psv-loader { color: var(--accent); }

  /* Lupa */
  #lens {
    position: absolute; left: 0; top: 0; width: 260px; height: 260px; border-radius: 50%;
    overflow: hidden; pointer-events: none; display: none; z-index: 50;
    box-shadow: 0 0 0 3px rgba(255,255,255,.85), 0 8px 30px rgba(0,0,0,.6), inset 0 0 25px rgba(0,0,0,.45);
    background: #000; will-change: transform;
  }
  #lens-view { position: absolute; inset: 0; }
  #lens::after { /* brillo de vidrio */
    content: ""; position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle at 30% 25%, rgba(255,255,255,.28), rgba(255,255,255,0) 35%);
  }
  #lens.plain { box-shadow: none; }
  #lens.plain::after { display: none; }

  /* Menú para cambiar de panorámica (esquina superior derecha del visor) */
  #switch {
    position: absolute; top: 12px; right: 12px; z-index: 60; display: flex; gap: 4px; padding: 4px;
    background: rgba(8, 11, 12, .72); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    border: 1px solid var(--line); border-radius: 3px;
  }
  #switch button {
    font: 700 12px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; white-space: nowrap;
    color: rgba(255, 255, 255, .88); background: transparent; border: 1px solid transparent; border-radius: 2px;
    padding: 10px 14px; cursor: pointer; touch-action: manipulation; transition: border-color .15s, background .15s;
  }
  #switch button:hover { border-color: rgba(0, 173, 180, .6); }
  #switch button[aria-selected="true"] { border-color: var(--accent); background: rgba(0, 173, 180, .18); color: #fff; cursor: default; }
  #switch button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  #switch button[disabled] { opacity: .55; }

  /* Pantallas chicas: todo un poco más compacto; la descripción se recorta y se abre al tocar el encabezado */
  @media (max-width: 640px) {
    #intro { padding: 12px 16px 10px; }
    #intro .rule { width: 28px; margin-bottom: 7px; }
    #intro h1 { font-size: 16px; margin-bottom: 4px; }
    #intro p { font-size: 12.5px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    #intro.open p { display: block; }
    #intro.has-more { cursor: pointer; }
    #switch { top: 8px; right: 8px; padding: 3px; }
    #switch button { padding: 9px 10px; font-size: 11px; letter-spacing: .05em; }
  }
  @media (max-height: 480px) and (orientation: landscape) {
    #intro { padding: 8px 16px 6px; }
    #intro p { display: none; }
    #intro .rule { display: none; }
  }
#lens {box-shadow:0 0 0 3px #00adb4,0 8px 30px #0007;}
</style>
</head>
<body>
<header id="intro">
  <span class="rule"></span>
  <h1 id="title"></h1>
  <p id="desc"></p>
</header>
<main id="stage">
  <div id="main"></div>
  <div id="lens"><div id="lens-view"></div></div>
  <nav id="switch" role="tablist" aria-label="Panoramica"></nav>
</main>
<script type="importmap">
{ "imports": {
    "three": "./vendor/three/three.module.js",
    "@photo-sphere-viewer/core": "./vendor/psv/index.module.js",
    "@photo-sphere-viewer/equirectangular-tiles-adapter": "./vendor/psv/equirectangular-tiles-adapter.module.js"
} }
</script>
<script type="module" src="app.js?v=20261117-2"></script>
</body>
</html>
